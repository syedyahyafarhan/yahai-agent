<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yahai.ai - Autonomous AI Agent</title>
    <!-- Tailwind CSS with Typography plugin enabled -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <!-- Marked.js for rendering Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Code Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-lg text-lg">Y</div>
            <div>
                <h1 class="font-bold text-lg tracking-wide">yahai.ai</h1>
                <p class="text-xs text-emerald-400 flex items-center">
                    <span class="w-2 h-2 bg-emerald-400 rounded-full inline-block mr-1.5 animate-pulse"></span> Backend Connected
                </p>
            </div>
        </div>
        <span class="text-xs bg-gray-700 px-2.5 py-1 rounded-full text-gray-300">FastAPI + Groq + Tools</span>
    </header>

    <!-- Chat Message Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-6 max-w-4xl w-full mx-auto">
        <!-- Welcome Message -->
        <div class="flex items-start space-x-3">
            <div class="bg-indigo-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold shrink-0">AI</div>
            <div class="bg-gray-800 border border-gray-700 p-4 rounded-2xl max-w-xl text-sm leading-relaxed shadow-sm prose prose-invert">
                Hello! I am <strong>yahai.ai</strong>, your autonomous multi-tool agent. I can search the web, execute Python scripts, and generate images. How can I help you today?
            </div>
        </div>
    </main>

    <!-- Input Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 p-4 shadow-lg">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-3">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Ask anything or request a task..." 
                class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-gray-100 placeholder-gray-500 shadow-inner"
                autocomplete="off"
                required
            >
            <button 
                type="submit" 
                id="send-btn"
                class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-xl text-sm transition shadow-md flex items-center justify-center shrink-0"
            >
                Send
            </button>
        </form>
    </footer>

    <!-- Client-Side JavaScript to Handle Stream -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        let messageHistory = [
            {
                role: "system",
                content: "You are a helpful AI assistant. Format your answers clearly with Markdown, headers (###), bullet points, tables, and code blocks."
            }
        ];

        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50');

            appendUserMessage(text);
            messageHistory.push({ role: "user", content: text });

            const aiBubbleId = 'ai-msg-' + Date.now();
            const aiContentDiv = appendAiStreamingPlaceholder(aiBubbleId);

            let fullRawResponse = "";

            try {
                const response = await fetch('http://127.0.0.1:8000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messageHistory })
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    fullRawResponse += chunk;
                    
                    // Render raw markdown directly with preserved newlines
                    aiContentDiv.innerHTML = marked.parse(fullRawResponse);
                    if (window.hljs) hljs.highlightAll();
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }

                aiContentDiv.innerHTML = marked.parse(fullRawResponse);
                if (window.hljs) hljs.highlightAll();

                messageHistory.push({ role: "assistant", content: fullRawResponse });

            } catch (error) {
                console.error("Stream error:", error);
                aiContentDiv.innerHTML = `<span class="text-rose-400 font-medium">Connection Error: Could not complete stream.</span>`;
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-50');
                userInput.focus();
            }
        });

        function appendUserMessage(text) {
            const html = `
                <div class="flex items-start justify-end space-x-3">
                    <div class="bg-indigo-600 text-white p-4 rounded-2xl rounded-tr-none max-w-xl text-sm leading-relaxed shadow-lg">
                        ${escapeHtml(text)}
                    </div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', html);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendAiStreamingPlaceholder(id) {
            const html = `
                <div class="flex items-start space-x-3">
                    <div class="h-8 w-8 bg-gradient-to-tr from-indigo-600 to-cyan-400 rounded-xl flex items-center justify-center text-white font-bold text-xs shrink-0 shadow-md">
                        Y
                    </div>
                    <div id="${id}" class="bg-slate-900 border border-slate-800 p-5 rounded-2xl rounded-tl-none max-w-3xl text-sm leading-relaxed shadow-md text-slate-300 prose prose-invert max-w-none">
                        <div class="flex items-center space-x-2 text-slate-400 text-xs">
                            <span class="h-2 w-2 bg-indigo-500 rounded-full animate-ping"></span>
                            <span>Thinking & processing request...</span>
                        </div>
                    </div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', html);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return document.getElementById(id);
        }

        function escapeHtml(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
